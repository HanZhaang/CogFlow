description: CogFlow public release
results_root_dir: results_babel
dataset: babel
dataset_name: babel_dataset
data_dir: ./data/babel
num_workers: 4

past_frames: 30
future_frames: 60
agents: 22
dt: 0.033
checkpt_freq: 10
max_num_ckpts: 5

overfit: False
n_train: 9409
n_val: 2688
n_test: 2688
rotate: False
data_norm: min_max

load_pretrained: False
ckpt_path: null
fix_random_seed: True
seed: 42
init_lr: 0.001

denoising_method: fm
sampling_steps: 10
t_schedule: logit_normal
objective: pred_data
sigma_data: 0.13
fm_skewed_t: null
logit_norm_mean: -0.5
logit_norm_std: 1.5
fm_wrapper: direct
fm_rew_sqrt: False
fm_in_scaling: True
drop_method: emb
drop_logi_k: 20.0
drop_logi_m: 0.5
use_pre_norm: False
tied_noise: True

LOSS_NN_MODE: agent
LOSS_REG_REDUCTION: sum
LOSS_REG_SQUARED: False
LOSS_VELOCITY: False
LOSS_CTRL: False
LOSS_STAB: False
LOSS_BND:
  ENABLE: False
  WEIGHT: 0.001
  WARMUP_EPOCHS: 10
  RAMP_EPOCHS: 20
  ALPHA: 0.01
  BETA: 1.0
  TAU: 1.0
  LATE_ONLY: True
  LATE_RATIO: 0.5
  BETA_MODE: fixed
  BETA_QUANTILE: 0.95
  DETACH_BETA_STAT: True
  NORM_MODE: sum

CTRL_U_KEY: fut_cond_cue
CNSDE: m2
notes: Flow Matching

MODEL:
  NAME: cogflow
  AGENT_DIM: 3
  NUM_PROPOSED_QUERY: 20
  MODEL_OUT_DIM: 180
  REGRESSION_MLPS: [128, 256, 64, 3]
  CLASSIFICATION_MLPS: [128, 128, 1]
  NUM_REGIMES: 3
  USE_PE_QUERY: True
  USE_PE_AGENT: True
  COND_D_CUE: 13
  COND_D_HIST: 16
  COG_D_Z: 64
  M2_DECODER_STYLE: historical_pre_film
  SDE_CONTROL_STYLE: encoded
  CONTEXT_ENCODER:
    NAME: MTREncoder
    DATA_TYPE: babel
    NUM_OF_ATTN_NEIGHBORS: 22
    NUM_INPUT_CONTEXT: 9
    NUM_CHANNEL_IN_MLP_AGENT: 256
    NUM_LAYER_IN_MLP_AGENT: 3
    D_MODEL: 128
    NUM_ATTN_LAYERS: 4
    NUM_ATTN_HEAD: 8
    DROPOUT_OF_ATTN: 0.1
  MOTION_DECODER:
    NAME: MTRDecoder
    D_MODEL: 128
    NUM_DECODER_BLOCKS: 4
    NUM_ATTN_HEAD: 8
    DROPOUT_OF_ATTN: 0.1

denoising_head_preds: 20
k_preds: 20
train_batch_size: 256
test_batch_size: 256

OPTIMIZATION:
  NUM_EPOCHS: 600
  OPTIMIZER: AdamW
  LR: 0.001
  WEIGHT_DECAY: 0.05
  SCHEDULER: cosineAnnealingLRwithWarmup
  LR_CLIP: 0.000001
  GRAD_NORM_CLIP: 1.0
  LOSS_WEIGHTS:
    cls: 0
    reg: 1.0
    vel: 0.2
    omega: 0
